<div class="page-container container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Manage Categories</h2>
    <a routerLink="/admin/categories/create" class="btn btn-brand">
      <i class="bi bi-plus-lg me-1"></i>New Category
    </a>
  </div>

  @if (loading()) {
    <app-loading message="Loading categories..."></app-loading>
  } @else if (categories().length === 0) {
    <app-empty-state icon="bi-tags" title="No categories yet" message="Create your first category."></app-empty-state>
  } @else {
    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white shadow-sm">
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (category of categories(); track category._id) {
            <tr>
              <td>
                <img
                  [src]="category.image || 'https://placehold.co/60x60?text=Cat'"
                  style="width: 48px; height: 48px; object-fit: cover;"
                  class="rounded"
                  [alt]="category.name"
                />
              </td>
              <td>{{ category.name }}</td>
              <td class="text-end">
                <a [routerLink]="['/admin/categories', category._id, 'edit']" class="btn btn-outline-secondary btn-sm me-2">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button class="btn btn-outline-danger btn-sm" (click)="deleteCategory(category)">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
