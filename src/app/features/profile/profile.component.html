<div class="page-container container" style="max-width: 550px;">
  <h2 class="mb-4">My Profile</h2>

  @if (loading()) {
    <app-loading message="Loading your profile..."></app-loading>
  } @else {
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              formControlName="name"
              [class.is-invalid]="f.name.invalid && f.name.touched"
            />
            @if (f.name.invalid && f.name.touched) {
              <div class="invalid-feedback">Name must be 2-100 characters.</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" formControlName="phone" />
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" formControlName="address" />
          </div>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Leave blank to keep current password"
              formControlName="password"
              [class.is-invalid]="f.password.invalid && f.password.touched"
            />
            @if (f.password.invalid && f.password.touched) {
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            }
          </div>

          <button type="submit" class="btn btn-brand w-100" [disabled]="saving()">
            @if (saving()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            Save Changes
          </button>
        </form>
      </div>
    </div>
  }
</div>
