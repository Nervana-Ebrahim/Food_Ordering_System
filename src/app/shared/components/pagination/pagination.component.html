@if (totalPages > 1) {
  <nav aria-label="Pagination" class="d-flex justify-content-center mt-4">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="page === 1">
        <button class="page-link" (click)="goTo(page - 1)">Previous</button>
      </li>
      @for (p of pages; track p) {
        <li class="page-item" [class.active]="p === page">
          <button class="page-link" (click)="goTo(p)">{{ p }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="page === totalPages">
        <button class="page-link" (click)="goTo(page + 1)">Next</button>
      </li>
    </ul>
  </nav>
}
