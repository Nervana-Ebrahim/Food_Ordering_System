<div class="card h-100 shadow-sm card-hover">
  <a [routerLink]="['/foods', food._id]" class="text-decoration-none text-dark">
    <img
      [src]="food.image  'https://placehold.co/400x250?text=Food'"
      class="card-img-top"
      style="height: 180px; object-fit: cover;"
      [alt]="food.name"
    />
    <div class="card-body d-flex flex-column">
      <div class="d-flex justify-content-between align-items-start">
        <h5 class="card-title mb-1">{{ food.name }}</h5>
        @if (!food.available) {
          <span class="badge text-bg-secondary status-badge">Unavailable</span>
        }
      </div>
      @if (categoryName) {
        <span class="badge text-bg-light border text-secondary mb-2 align-self-start">{{ categoryName }}</span>
      }
      <p class="card-text text-secondary small flex-grow-1">
        {{ food.description  'No description provided.' }}
      </p>
      <div class="fw-bold text-brand fs-5">{{ food.price | number: '1.2-2' }} EGP</div>
    </div>
  </a>
  <div class="card-footer bg-white border-top-0 d-flex gap-2">
    <a [routerLink]="['/foods', food._id]" class="btn btn-outline-secondary btn-sm flex-fill">View Details</a>
    <button
      class="btn btn-brand btn-sm flex-fill"
      [disabled]="!food.available"
      (click)="onAddToCart($event)"
    >
      Add to Cart
    </button>
  </div>
</div>
